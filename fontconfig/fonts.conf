<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
  <!-- WORKAROUND: Prefer CBDT Noto Color Emoji (local) over COLRv1 (system) for foot/fcft compatibility.
       Remove once https://codeberg.org/dnkl/fcft/src/branch/colrv1 is merged. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-noto-color-emoji-fonts/Noto-COLRv1.ttf</glob>
    </rejectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Noto Emoji</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
